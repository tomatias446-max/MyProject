<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Backgammon Board</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="game-ui">

    <!-- TOP PANEL -->
    <div class="top-panel">

      <div class="turn-display">
        Turn: White
      </div>

      <div class="dice-display">
        Dice: - -
      </div>

      <button onclick="alert('Clicked')">
        Roll Dice
      </button>

    </div>

    <!-- BOARD -->
    <div class="board">

      <!-- LEFT -->
      <div class="section">

        <!-- TOP -->
        <div class="row top">

          <div class="point dark" onclick="alert('Clicked')"></div>
          <div class="point light" onclick="alert('Clicked')"></div>
          <div class="point dark" onclick="alert('Clicked')"></div>
          <div class="point light" onclick="alert('Clicked')"></div>
          <div class="point dark" onclick="alert('Clicked')"></div>
          <div class="point light" onclick="alert('Clicked')"></div>

        </div>

        <!-- BOTTOM -->
        <div class="row bottom">

          <div class="point light" onclick="alert('Clicked')"></div>
          <div class="point dark" onclick="alert('Clicked')"></div>
          <div class="point light" onclick="alert('Clicked')"></div>
          <div class="point dark" onclick="alert('Clicked')"></div>
          <div class="point light" onclick="alert('Clicked')"></div>
          <div class="point dark" onclick="alert('Clicked')"></div>

        </div>

      </div>

      <!-- CENTER BAR -->
      <div class="bar" onclick="alert('Clicked')"></div>

      <!-- RIGHT -->
      <div class="section">

        <!-- TOP -->
        <div class="row top">

          <div class="point dark" onclick="alert('Clicked')"></div>
          <div class="point light" onclick="alert('Clicked')"></div>
          <div class="point dark" onclick="alert('Clicked')"></div>
          <div class="point light" onclick="alert('Clicked')"></div>
          <div class="point dark" onclick="alert('Clicked')"></div>
          <div class="point light" onclick="alert('Clicked')"></div>

        </div>

        <!-- BOTTOM -->
        <div class="row bottom">

          <div class="point light" onclick="alert('Clicked')"></div>
          <div class="point dark" onclick="alert('Clicked')"></div>
          <div class="point light" onclick="alert('Clicked')"></div>
          <div class="point dark" onclick="alert('Clicked')"></div>
          <div class="point light" onclick="alert('Clicked')"></div>
          <div class="point dark" onclick="alert('Clicked')"></div>

        </div>

      </div>

    </div>

  </div>

</body>
</html>
