<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Backgammon</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="game-ui">

    <!-- TOP UI -->
    <div class="top-panel">

      <div id="turnDisplay" class="turn-display">
        Turn: White
      </div>

      <div id="dice" class="dice-display">
        Dice: -,-
      </div>

      <button onclick="roll()">
        Roll Dice
      </button>

    </div>

    <!-- BOARD -->
    <div class="board">

      <!-- LEFT 12 -->
      <div class="section">

        <div class="row top">
          <div class="point dark"></div>
          <div class="point light"></div>
          <div class="point dark"></div>
          <div class="point light"></div>
          <div class="point dark"></div>
          <div class="point light"></div>
        </div>

        <div class="row bottom">
          <div class="point light"></div>
          <div class="point dark"></div>
          <div class="point light"></div>
          <div class="point dark"></div>
          <div class="point light"></div>
          <div class="point dark"></div>
        </div>

      </div>

      <!-- BAR -->
      <div class="bar"></div>

      <!-- RIGHT 12 -->
      <div class="section">

        <div class="row top">
          <div class="point dark"></div>
          <div class="point light"></div>
          <div class="point dark"></div>
          <div class="point light"></div>
          <div class="point dark"></div>
          <div class="point light"></div>
        </div>

        <div class="row bottom">
          <div class="point light"></div>
          <div class="point dark"></div>
          <div class="point light"></div>
          <div class="point dark"></div>
          <div class="point light"></div>
          <div class="point dark"></div>
        </div>

      </div>

    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
