<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Backgammon</title>



  <link rel="stylesheet" href="style.css">

</head>



<body>



  <div class="game-ui">



    <!-- TOP UI -->

    <div class="top-panel">



      <div id="turnDisplay" class="turn-display">

        Turn: White

      </div>



      <div id="dice" class="dice-display">

        Dice: -,-

      </div>



      <button onclick="roll()">

        Roll Dice

      </button>



    </div>



    <!-- BOARD -->

    <div class="board">



      <div class="section">



  <!-- TOP -->

  <div class="row top">

    <div class="point dark" id="12"></div>

    <div class="point light" id="13"></div>

    <div class="point dark" id="14"></div>

    <div class="point light" id="15"></div>

    <div class="point dark" id="16"></div>

    <div class="point light" id="17"></div>

  </div>



  <!-- BOTTOM -->

  <div class="row bottom">

    <div class="point light" id="11"></div>

    <div class="point dark" id="10"></div>

    <div class="point light" id="9"></div>

    <div class="point dark" id="8"></div>

    <div class="point light" id="7"></div>

    <div class="point dark" id="6"></div>

  </div>



</div>



      <!-- BAR -->

      <div class="bar"></div>



      <!-- RIGHT 12 -->

     <div class="section">



  <!-- TOP -->

  <div class="row top">

    <div class="point dark" id="18"></div>

    <div class="point light" id="19"></div>

    <div class="point dark" id="20"></div>

    <div class="point light" id="21"></div>

    <div class="point dark" id="22"></div>

    <div class="point light" id="23"></div>

  </div>



  <!-- BOTTOM -->

  <div class="row bottom">

    <div class="point light" id="5"></div>

    <div class="point dark" id="4"></div>

    <div class="point light" id="3"></div>

    <div class="point dark" id="2"></div>

    <div class="point light" id="1"></div>

    <div class="point dark" id="0"></div>

  </div>



</div>



    </div>



  </div>



  <script src="script.js"></script>



</body>

</html>
