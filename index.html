<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Backgammon</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="game-ui">

    <!-- TOP UI -->
    <div class="top-panel">

      <div id="turnDisplay" class="turn-display">
        Turn: White
      </div>

      <div id="dice" class="dice-display">
        Dice: -,-
      </div>

      <button onclick="roll()">
        Roll Dice
      </button>

    </div>

    <!-- BOARD -->
    <div class="board">

      <div class="section">

  <!-- TOP -->
  <div class="row top">
    <div class="point dark" id="point12"></div>
    <div class="point light" id="point13"></div>
    <div class="point dark" id="point14"></div>
    <div class="point light" id="point15"></div>
    <div class="point dark" id="point16"></div>
    <div class="point light" id="point17"></div>
  </div>

  <!-- BOTTOM -->
  <div class="row bottom">
    <div class="point light" id="point11"></div>
    <div class="point dark" id="point10"></div>
    <div class="point light" id="point9"></div>
    <div class="point dark" id="point8"></div>
    <div class="point light" id="point7"></div>
    <div class="point dark" id="point6"></div>
  </div>

</div>

      <!-- BAR -->
      <div class="bar"></div>

      <!-- RIGHT 12 -->
     <div class="section">

  <!-- TOP -->
  <div class="row top">
    <div class="point dark" id="point18"></div>
    <div class="point light" id="point19"></div>
    <div class="point dark" id="point20"></div>
    <div class="point light" id="point21"></div>
    <div class="point dark" id="point22"></div>
    <div class="point light" id="point23"></div>
  </div>

  <!-- BOTTOM -->
  <div class="row bottom">
    <div class="point light" id="point5"></div>
    <div class="point dark" id="point4"></div>
    <div class="point light" id="point3"></div>
    <div class="point dark" id="point2"></div>
    <div class="point light" id="point1"></div>
    <div class="point dark" id="point0"></div>
  </div>

</div>

    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
